class_name: SimpleNet
trainable: true
beta: 0
ckpt: ${ckpt}
params:
  in_nc: ${data.bands}
  out_nc: ${data.bands}
  nf: 48
  ssl: ${data.ssl}
  n_ssl: ${data.n_ssl}
  ckpt: ${model.ckpt} 
        
  base:
    optimizer: ${optim.optimizer}
    lr_scheduler: ${optim.scheduler}
    block_inference:
      use_bi: true
      block_size: 512
      overlap: 0
      # block_size: 64
      # overlap: 6
      padding: "reflect"
backtracking:
  monitor: "val_mpsnr"
  mode: "max"
  dirpath: "backtracking"
  period: 5
  div_thresh: 4
  dummy: False
  lr_decay: 0.8
id: simpleNet_${model.params.in_nc}_${data.name}_${test.name}_${noise.id}_${optim.optimizer.params.lr}
