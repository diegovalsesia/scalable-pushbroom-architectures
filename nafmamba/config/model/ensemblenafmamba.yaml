class_name: EnsembleNAFMambaModel
trainable: true
beta: 0
ckpt: ${ckpt}
params:
  channels: ${data.bands}
  features: 96
  num_denoisers: 5
  sample_stage_lambda: ${oc.select:trainer.sample_stage_lambda,${test.sample_stage_lambda}}
  ssl: ${data.ssl}
  n_ssl: ${data.n_ssl}
  ckpt: ${model.ckpt} 
  # ckpt_denoisers: ${model.ckpt}
  # ckpt_denoisers: [your_path, your_path,your_path]
  base:
    optimizer: ${optim.optimizer}
    lr_scheduler: ${optim.scheduler}
    block_inference:
      use_bi: true
      block_size: 512
      overlap: 0
      # block_size: 64
      # overlap: 6
      padding: "reflect"
backtracking:
  monitor: "val_mpsnr"
  mode: "max"
  dirpath: "backtracking"
  period: 5
  div_thresh: 4
  dummy: False
  lr_decay: 0.8
id: Ensemblenafmamba_${model.params.channels}_${data.name}_${test.name}_${noise.id}_${optim.optimizer.params.lr}
