seed: 0
experiment_name: "ensemble7_denoisers_lambda0_continues"
defaults:
  - _self_
  - mode: train
  - data: icvl
  - noise: uniform
  - model: ssrt
  - trainer: ssrt
  - launcher: default
  - test: icvl15
  - optim: ssrt

refine: False

ckpt: null
gpu_ids: 0
load_ckpt: null
checkpoint:
  dirpath: "ckpts"
  monitor: "val_mpsnr"
  save_last: True
  save_top_k: -1
  mode: "max"
  every_n_epochs: 10
  filename: 'epoch{epoch}-val_mpsnr{val_mpsnr:.2f}'
  auto_insert_metric_name: False
  
checkpoint_best:
  dirpath: "best"
  monitor: "val_mpsnr"
  save_last: False
  save_top_k: 1
  mode: "max"
  every_n_epochs: 1
  filename: 'best_epoch_{epoch}-val_mpsnr_{val_mpsnr:.2f}'
  auto_insert_metric_name: False

stdout: ${trainer.logging_level}

hydra:
  run:
    dir: "./data/${mode.folder}/${model.class_name}/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}/${model.id}"
  sweep:
    dir: "./data/${mode.folder}/${model.class_name}/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}_mr_${cluster.id}"
    subdir: "${mode.prefix}${model.id}/${mode.suffix}"
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(name)s][%(levelname)s] - %(message)s'
      detailed:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        level: ${stdout}
        stream: ext://sys.stdout
      file:
        class : logging.handlers.RotatingFileHandler
        formatter: detailed
        level: DEBUG
        filename: debug.log
    root:
      handlers: [console, file]

    disable_existing_loggers: false
